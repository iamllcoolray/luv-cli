name             = Luv-CLI
author           = Nobunaga <nobunaga@cpan.org>
license          = Perl_5
copyright_holder = Ogun
version          = 0.005

[@Basic]
[AutoPrereqs]
[CPANFile]

[ExecDir]
dir = bin

[MetaResources]
repository.url  = https://github.com/iamllcoolray/luv-cli
repository.type = git

[MetaJSON]
[ReadmeFromPod]
[PodWeaver]
[PerlTidy]

[CheckChangeLog]
[NextRelease]
[CheckIssues]
[ConfirmRelease]

[PruneFiles]
filename = dist.ini